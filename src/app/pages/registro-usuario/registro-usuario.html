<app-sidebar [abierto]="menuAbierto()" (cerrar)="menuAbierto.set(false)" />

<div class="pagina">
  <header class="encabezado">
    <button class="hamburguesa" (click)="menuAbierto.set(true)" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="titulo">Administración de usuarios</h1>
  </header>

  <h2 class="subtitulo" style="display:inline-block; margin: 28px 0 20px;">Información Personal</h2>

  <form #formulario="ngForm" class="formulario" (ngSubmit)="guardar()" style="max-width: 720px;">
    <div class="grid-formulario" style="grid-template-columns: 1fr;">
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre" />
      </div>

      <div class="campo">
        <label for="tipo">Tipo suscripción</label>
        <select id="tipo" name="tipoSuscripcion" [(ngModel)]="tipoSuscripcion">
          <option value="" disabled>Seleccione una opción</option>
          @for (t of tiposSuscripcion; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono:</label>
        <input id="telefono" name="telefono" type="tel" [(ngModel)]="telefono" />
      </div>

      <div class="campo">
        <label for="fecha">Fecha de registro:</label>
        <input id="fecha" name="fechaRegistro" type="date" [(ngModel)]="fechaRegistro" />
      </div>
    </div>

    <div class="botones">
      <button type="submit" class="btn-verde">Agregar</button>
      <button type="button" class="btn-rojo" (click)="limpiar(formulario)">Limpiar</button>
    </div>
  </form>
</div>

@if (mensaje(); as m) {
  <div class="modal-fondo">
    <div class="modal">
      <button class="cerrar-modal" (click)="cerrarMensaje()">✕</button>
      <h3 [class.error-texto]="m.tipo === 'error'">{{ m.texto }}</h3>
    </div>
  </div>
}
