<app-sidebar [abierto]="menuAbierto()" (cerrar)="menuAbierto.set(false)" />

<div class="pagina">
  <header class="encabezado">
    <button class="hamburguesa" (click)="menuAbierto.set(true)" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="titulo">Agregar Entrenador</h1>
  </header>

  <h2 class="subtitulo" style="display:inline-block; margin: 28px 0 20px;">Datos personales</h2>

  <form #formulario="ngForm" class="formulario" (ngSubmit)="guardar()">
    <div class="grid-formulario">
      <div class="columna">
        <div class="campo">
          <label for="nombre">Nombre Completo:</label>
          <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre" />
        </div>

        <div class="campo">
          <label for="edad">Edad</label>
          <input id="edad" name="edad" type="number" min="0" [(ngModel)]="edad" />
        </div>

        <div class="campo">
          <label for="experiencia">Experiencia (en años)</label>
          <input id="experiencia" name="experiencia" type="number" min="0" [(ngModel)]="experiencia" />
        </div>

        <div class="campo">
          <label for="especialidad">Especialidad:</label>
          <input id="especialidad" name="especialidad" type="text" [(ngModel)]="especialidad" />
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" [(ngModel)]="telefono" />
        </div>
      </div>

      <div class="columna">
        <div class="campo">
          <label>INE</label>
          <input type="file" accept=".pdf,.jpg,.jpeg,.png" (change)="elegirArchivo('ine', $event)" />
        </div>

        <div class="campo">
          <label>CURP</label>
          <input type="file" accept=".pdf,.jpg,.jpeg,.png" (change)="elegirArchivo('curp', $event)" />
        </div>

        <div class="campo">
          <label>C.V.</label>
          <input type="file" accept=".pdf,.doc,.docx" (change)="elegirArchivo('cv', $event)" />
        </div>

        <div class="avatar">👤</div>
      </div>
    </div>

    <div class="botones">
      <button type="submit" class="btn-verde">Guardar</button>
      <button type="button" class="btn-rojo" (click)="limpiar(formulario)">Limpiar</button>
    </div>
  </form>
</div>

@if (mensaje(); as m) {
  <div class="modal-fondo">
    <div class="modal">
      <button class="cerrar-modal" (click)="cerrarMensaje()">✕</button>
      <h3 [class.error-texto]="m.tipo === 'error'">{{ m.texto }}</h3>
    </div>
  </div>
}
